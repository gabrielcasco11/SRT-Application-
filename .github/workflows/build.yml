name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk srt-monitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: srt-monitor-apk
          path: srt-monitor.apk

      # Publishes the APK as a release so the phone can download it from a fixed link:
      # https://github.com/<you>/<repo>/releases/latest/download/srt-monitor.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SRT Monitor build ${{ github.run_number }}
          files: srt-monitor.apk
          make_latest: true
